name: Android wrapper

on:
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, lint and compilation
        working-directory: android
        run: ./gradlew testDebugUnitTest lintRelease assembleDebug bundleRelease --console plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-ci-debug-and-unsigned-bundle
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results-release.html
            android/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
      # No release signing secrets in pull-request CI. The bundle above is
      # intentionally unsigned and cannot be uploaded to Google Play.
